    <!-- JavaScript Application Logic -->
    <script>
        // Store Current User Info
        let currentUser = {
            name: "00000 김민기",
            role: "student"

        // Master Passwords for Leader/Teacher Verification
        const AUTH_PASSWORDS = ["10410", "teacher123", "0000"];

        let currentDetailId = 1;
        let selectedFloor = "전체";
        let activeTab = "home";

        // Mock Timetable based on real floor plans
        const timetableData = [
            { period: 1, subject: "국어", room: "1-4 교실 (1층)", status: "normal" },
            { period: 2, subject: "통합과학", room: "과학실 I (2층 서편)", status: "changed", id: 1 },

            { period: 4, subject: "영어", room: "영어전용실 (3층 서편)", status: "changed", id: 2 },
            { period: 5, subject: "체육", room: "청솔마당 (1층)", status: "normal" },
            { period: 6, subject: "한국사", room: "1-4 교실 (1층)", status: "normal" },
            { period: 7, subject: "미술", room: "미술실 (4층 서편)", status: "changed", id: 3 },
        ];

        // Mock Class Changes List matched with real campus map layout
        let classroomChanges = [
            {
                id: 1,
                period: "2교시 (09:50 - 10:40)",
                subject: "통합과학",
                fromRoom: "1-4 교실 (1층)",
                toRoom: "과학실 I (2층 서편)",
                floor: "2층",
                reason: "원소 반응 및 화학 실험 실습",
                registeredBy: "선생님 (김과학)",
                date: "오늘",
                routeInfo: "1층 아트홀 중앙 계단 이용 ➡️ 2층 중앙홀 ➡️ 서편 복도 끝 과학실 I",
                teacherNote: "실험복 착용 필수! 보안안경 준비."

                fromRoom: "1-4 교실 (1층)",
                toRoom: "영어전용실 (3층 서편)",
                floor: "3층",
                reason: "수능형 영어 듣기 평가 및 모둠 회화",
                registeredBy: "반장 (00000 김민기)",
                date: "오늘",
                routeInfo: "중앙 계단으로 3층 올라가기 ➡️ 컴퓨터실 옆 영어전용실 입실",
                teacherNote: "영어 교재 및 수능 단어장 반드시 지참."
            },
            {
                id: 3,
                period: "7교시 (15:10 - 16:00)",
                subject: "미술",
                fromRoom: "1-4 교실 (1층)",
                toRoom: "미술실 (4층 서편)",
                floor: "4층",
                reason: "4층 미술실 유화 실기 작업실 이용",
                registeredBy: "선생님 (박미술)",
                date: "오늘",
                routeInfo: "중앙 계단 탑승 ➡️ 4층홀 ➡️ 서편 복도 진입 후 미술실",
                teacherNote: "개인 아크릴 붓 및 앞치마 개별 준비"
            }
        ];

        // Header Name Update Utility
        function updateHeaderUI() {
            const headerNameEl = document.getElementById('header-user-name');
            if (headerNameEl) {
                headerNameEl.innerText = currentUser.name;
            }
        }

        // Tab Switching
        function switchTab(tab, id = null) {
            activeTab = tab;
            const navs = ['home', 'list', 'input', 'detail'];
            navs.forEach(n => {
                const btn = document.getElementById(`nav-${n}`);
                if (btn) {
                    if (n === tab) {
                        btn.className = "flex flex-col items-center text-[#E80000] font-bold transition scale-105";
                    } else {
                        btn.className = "flex flex-col items-center text-gray-400 hover:text-gray-700 transition active:scale-90";
                    }
                }
            });

            const content = document.getElementById('app-content');
            if (id) currentDetailId = id;

            switch(tab) {
                case 'home':
                    content.innerHTML = renderHomeView();
                    break;
                case 'list':
                    content.innerHTML = renderListView();
                    break;
                case 'input':
                    content.innerHTML = renderInputView();
                    break;
                case 'detail':
                    content.innerHTML = renderDetailView(currentDetailId);
                    break;
            }
        }

        // Helper to parse student ID dynamically (e.g. "10410 김민기" -> Grade 1, Class 4 / "20512 홍길동" -> Grade 2, Class 5)
        function parseStudentId(nameStr) {
            if (!nameStr) return { grade: 1, roomNum: 4, floor: "1층", label: "1층 1-4교실" };

            // Find first 4-5 digit sequence or grade/class numbers
            const numMatch = nameStr.match(/(\d{1})(\d{2})\d*/);
            if (numMatch) {
                const grade = parseInt(numMatch[1], 10);
                const classNum = parseInt(numMatch[2], 10);
                
                // Determine floor based on grade & class layout
                let floorStr = "1층";
                if (grade === 1) {
                    floorStr = classNum <= 6 ? "1층" : "2층";
                } else if (grade === 2) {
                    floorStr = classNum <= 3 ? "2층" : "3층";
                } else if (grade === 3) {
                    floorStr = "4층";
                }

                return {
                    grade: grade,
                    roomNum: classNum,
                    floor: floorStr,
                    label: `${floorStr} ${grade}-${classNum}교실`
                };
            }

            // Fallback for simple "1-4" pattern
            const altMatch = nameStr.match(/(\d)[-학년\s]+(\d)/);
            if (altMatch) {
                const grade = parseInt(altMatch[1], 10);
                const classNum = parseInt(altMatch[2], 10);
                let floorStr = grade === 1 ? "1층" : (grade === 2 ? "2층" : "4층");
                return {
                    grade: grade,
                    roomNum: classNum,
                    floor: floorStr,
                    label: `${floorStr} ${grade}-${classNum}교실`
                };
            }

            return { grade: 1, roomNum: 4, floor: "1층", label: "1층 1-4교실" };
        }

        // --- 1. HOME VIEW ---
        function renderHomeView() {
            const changedCount = classroomChanges.length;
            const parsed = parseStudentId(currentUser.name);

            return `

                            <div>
                                <h2 class="text-sm sm:text-base font-bold text-gray-900">오늘의 교실 변경 <span class="bg-[#E80000] text-white text-xs px-2 py-0.5 rounded-full ml-1">${changedCount}건</span></h2>
                                <p class="text-xs sm:text-sm text-gray-600 mt-1">쉬는 시간 10분 내에 빠른 이동이 필요합니다!</p>
                            </div>
                        </div>
                        <button onclick="switchTab('list')" class="text-xs sm:text-sm text-[#E80000] font-bold underline whitespace-nowrap">전체보기</button>
                    </div>

                    <!-- User Welcome Banner -->
                    <div class="bg-gradient-to-r from-slate-800 to-slate-700 text-white rounded-2xl p-4 sm:p-6 shadow-md flex justify-between items-center">
                        <div>
                            <span class="text-xs sm:text-sm text-amber-300 font-bold">📍 내 지정 교실: ${myRoomLabel}</span>
                            <div class="flex items-center space-x-2 mt-1">
                                <h3 class="text-lg sm:text-xl font-bold text-white">${currentUser.name} 님 👋</h3>
                                <button onclick="openProfileModal()" class="text-xs text-slate-300 hover:text-white underline flex items-center">
                                    <span class="material-symbols-outlined text-sm">edit</span>변경
                                </button>
                            </div>
                            <p class="text-[11px] sm:text-xs text-slate-300 mt-0.5">오늘도 이동수업 지각 없이 제시간에 쏙!</p>
                        </div>
                        <div class="text-right">
                            <span class="inline-block bg-white/20 text-white text-[10px] sm:text-xs px-3 py-1 rounded-full font-semibold">
                                ${currentUser.role === 'leader' ? '👑 반장/선생님' : '🎓 학생'}
                            </span>
                        </div>
                    </div>

                    <!-- Quick Action Buttons -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <button onclick="switchTab('list')" class="bg-[#E0DAD6] hover:bg-gray-300 text-gray-800 p-4 rounded-2xl font-bold text-xs sm:text-sm flex items-center justify-between shadow-sm transition active:scale-95">
                            <div class="flex items-center space-x-2">

                        </button>

                        <button onclick="${currentUser.role === 'leader' ? "switchTab('input')" : "showToast('선생님 또는 반장만 등록할 수 있습니다.')"}" class="bg-[#E80000] hover:bg-red-700 text-white p-4 rounded-2xl font-bold text-xs sm:text-sm flex items-center justify-between shadow-md transition active:scale-95">
                            <div class="flex items-center space-x-2">
                                <span class="material-symbols-outlined">add_circle</span>
                                <span>교실 변경 등록</span>
                            </div>
                            <span class="material-symbols-outlined text-sm">chevron_right</span>
                        </button>
                    </div>

                    <!-- Today's Timetable Grid -->
                    <div class="bg-white border border-gray-200 rounded-2xl p-4 sm:p-5 shadow-sm space-y-3">
                        <div class="flex justify-between items-center border-b pb-2">
                            <h3 class="font-bold text-gray-800 text-sm sm:text-base flex items-center">

                            <text x="225" y="126" text-anchor="middle" fill="#E2E8F0" font-size="7">3-5</text>
                            <rect x="243" y="110" width="32" height="25" fill="#334155" stroke="#475569" stroke-width="1" rx="2"/>
                            <text x="259" y="126" text-anchor="middle" fill="#E2E8F0" font-size="7">3-6</text>
                            <rect x="277" y="110" width="32" height="25" fill="#334155" stroke="#475569" stroke-width="1" rx="2"/>
                            <text x="293" y="126" text-anchor="middle" fill="#E2E8F0" font-size="7">3-7</text>

                            <g class="animate-bounce">
                                <circle cx="67" cy="107" r="5" fill="#EF4444"/>
                                <text x="67" y="87" text-anchor="middle" fill="#FCA5A5" font-size="7" font-weight="bold">📍 미술실 (7교시)</text>
                            </g>
                        </svg>
                    </div>
                `;
            } else { // "전체" (Overview Sketch)
                return `
                    <div class="w-full relative py-1">
                        <div class="text-[10px] text-amber-400 font-bold mb-2">흥덕고(좀비고) 1~4층 종합 건물 나침반</div>
                        <div class="grid grid-cols-2 gap-2 text-[10px]">
                            <div class="bg-slate-900 border border-slate-700 p-2 rounded-lg">
                                <span class="font-bold text-red-400">1층 (청솔마당/아트홀)</span>
                                <p class="text-[9px] text-slate-300 mt-1">1-1~1-6 교실, 급식소/조리실, 행정실, 학습도움실 1·2</p>
                            </div>
                            <div class="bg-slate-900 border border-slate-700 p-2 rounded-lg">
                                <span class="font-bold text-amber-300">2층 (과학실/보건실)</span>
                                <p class="text-[9px] text-slate-300 mt-1">과학실I·II·III, 영어실I, 보건실, 교무지원실, 1-7~1-10, 2-1~2-3</p>
                            </div>
                            <div class="bg-slate-900 border border-slate-700 p-2 rounded-lg">
                                <span class="font-bold text-blue-300">3층 (영어전용/컴퓨터실)</span>
                                <p class="text-[9px] text-slate-300 mt-1">영어전용실, 컴퓨터실, 세미나실, 도서실, 2-4~2-10 교실</p>
                            </div>
                            <div class="bg-slate-900 border border-slate-700 p-2 rounded-lg">
                                <span class="font-bold text-emerald-300">4층 (미술실/음악실)</span>
                                <p class="text-[9px] text-slate-300 mt-1">미술실, 음악실, 인터넷강의실, 3학년연구실, Wee클래스, 3-1~3-10</p>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function renderCards() {
            let filtered = classroomChanges;
            if (selectedFloor !== "전체") {
                filtered = filtered.filter(item => item.floor === selectedFloor);
            }
            if (filtered.length === 0) {
                return `<div class="bg-white p-6 rounded-2xl text-center text-xs text-gray-400 border border-dashed">해당 층에 등록된 이동 수업 교실 변경건이 없습니다.</div>`;
            }
            return filtered.map(item => `
                <div onclick="switchTab('detail', ${item.id})" class="bg-white border border-gray-200 rounded-2xl p-4 shadow-sm hover:border-[#E80000] cursor-pointer transition space-y-2">
                    <div class="flex justify-between items-start">
                        <div class="flex items-center space-x-2">
                            <span class="bg-[#FBEAEA] text-[#E80000] text-xs font-extrabold px-2.5 py-1 rounded-full">
                                ${item.floor}
                            </span>
                            <span class="text-xs font-bold text-gray-500">${item.period}</span>
                        </div>
                        <span class="text-[10px] text-gray-400 font-medium">등록자: ${item.registeredBy}</span>
                    </div>

                    <div class="flex items-center justify-between pt-1">
                        <div>
                            <h3 class="font-extrabold text-base text-gray-900">${item.subject}</h3>
                            <div class="text-xs text-gray-600 mt-0.5 flex items-center space-x-1">
                                <span class="line-through text-gray-400">${item.fromRoom}</span>
                                <span class="material-symbols-outlined text-xs text-[#E80000]">arrow_forward</span>
                                <span class="font-extrabold text-[#E80000]">${item.toRoom}</span>
                            </div>
                        </div>
                        <span class="material-symbols-outlined text-gray-400 text-xl">chevron_right</span>
                    </div>
                    
                    <div class="bg-slate-50 p-2 rounded-xl text-[11px] text-gray-600 flex items-center space-x-1 mt-1">
                        <span class="material-symbols-outlined text-xs text-amber-500">alt_route</span>
                        <span class="truncate">${item.routeInfo}</span>
                    </div>
                </div>
            `).join('');
        }

        function filterList() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const container = document.getElementById('change-card-container');
            if(!container) return;
            const filtered = classroomChanges.filter(item => 
                item.subject.toLowerCase().includes(query) ||
                item.toRoom.toLowerCase().includes(query) ||
                item.floor.toLowerCase().includes(query) ||
                item.registeredBy.toLowerCase().includes(query)
            );
            if (filtered.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-xs text-gray-400">검색 결과가 없습니다.</div>`;
                return;
            }
            container.innerHTML = filtered.map(item => `
                <div onclick="switchTab('detail', ${item.id})" class="bg-white border border-gray-200 rounded-2xl p-4 shadow-sm hover:border-[#E80000] cursor-pointer transition space-y-2">
                    <div class="flex justify-between items-start">
                        <div class="flex items-center space-x-2">
                            <span class="bg-[#FBEAEA] text-[#E80000] text-xs font-extrabold px-2.5 py-1 rounded-full">
                                ${item.floor}
                            </span>
                            <span class="text-xs font-bold text-gray-500">${item.period}</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between pt-1">
                        <div>
                            <h3 class="font-extrabold text-base text-gray-900">${item.subject}</h3>
                            <div class="text-xs text-gray-600 mt-0.5 flex items-center space-x-1">
                                <span class="line-through text-gray-400">${item.fromRoom}</span>
                                <span class="material-symbols-outlined text-xs text-[#E80000]">arrow_forward</span>
                                <span class="font-extrabold text-[#E80000]">${item.toRoom}</span>
                            </div>
                        </div>
                        <span class="material-symbols-outlined text-gray-400 text-xl">chevron_right</span>
                    </div>
                </div>
            `).join('');
        }

        function setFloorFilter(floor) {
            selectedFloor = floor;
            switchTab('list');
        }

        // --- 3. INPUT VIEW ---
        function renderInputView() {
            if (currentUser.role !== 'leader') {
                return `
                    <div class="bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-red-200 text-center space-y-4 animate-fadeIn">
                        <div class="w-14 h-14 bg-red-100 text-[#E80000] rounded-full flex items-center justify-center mx-auto">
                            <span class="material-symbols-outlined text-3xl">lock</span>
                        </div>
                        <div>
                            <h2 class="font-bold text-gray-800 text-base sm:text-lg">반장 / 선생님 전용 메뉴</h2>
                            <p class="text-xs sm:text-sm text-gray-500 mt-1">교실 변경 정보 등록은 반장 또는 선생님 권한이 필요합니다.</p>
                        </div>
                        <button onclick="openProfileModal()" class="w-full max-w-xs mx-auto bg-[#E80000] text-white py-3 rounded-xl text-xs sm:text-sm font-bold shadow-md block">
                            권한 변경 및 비밀번호 인증하기
                        </button>
                    </div>
                `;
            }

            const parsed = parseStudentId(currentUser.name);
            const defaultFromRoom = `${parsed.grade}-${parsed.roomNum} 교실 (${parsed.floor})`;

            return `
                <div class="space-y-4 animate-fadeIn">
                    <div>
                        <h2 class="text-lg sm:text-xl font-extrabold text-gray-800">교실 변경 정보 등록</h2>
                        <p class="text-xs sm:text-sm text-gray-500">갑작스럽게 변경된 이동 수업 교실을 등록하세요.</p>
                    </div>

                    <form onsubmit="handleFormSubmit(event)" class="bg-white border border-gray-200 rounded-2xl p-4 sm:p-6 shadow-sm space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">과목명 *</label>
                            <input type="text" id="input-subject" required placeholder="예: 수학, 과학, 미술" class="w-full border border-gray-300 rounded-xl p-3 text-xs sm:text-sm focus:ring-2 focus:ring-[#E80000] outline-none">
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">해당 교시 *</label>
                                <select id="input-period" class="w-full border border-gray-300 rounded-xl p-3 text-xs sm:text-sm focus:ring-2 focus:ring-[#E80000] outline-none bg-white">
                                    <option value="1교시 (08:50 - 09:40)">1교시</option>
                                    <option value="2교시 (09:50 - 10:40)">2교시</option>
                                    <option value="3교시 (10:50 - 11:40)">3교시</option>
                                    <option value="4교시 (11:50 - 12:40)">4교시</option>
                                    <option value="5교시 (13:30 - 14:20)">5교시</option>
                                    <option value="6교시 (14:30 - 15:20)">6교시</option>
                                    <option value="7교시 (15:30 - 16:20)">7교시</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">변경 층수 *</label>
                                <select id="input-floor" class="w-full border border-gray-300 rounded-xl p-3 text-xs sm:text-sm focus:ring-2 focus:ring-[#E80000] outline-none bg-white">
                                    <option value="1층">1층</option>
                                    <option value="2층">2층</option>
                                    <option value="3층">3층</option>
                                    <option value="4층">4층</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">기존 교실</label>
                                <input type="text" id="input-from" value="${defaultFromRoom}" class="w-full border border-gray-300 rounded-xl p-3 text-xs sm:text-sm focus:ring-2 focus:ring-[#E80000] outline-none">
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">변경 후 교실 *</label>
                                <input type="text" id="input-to" required placeholder="예: 과학실 I (2층)" class="w-full border border-gray-300 rounded-xl p-3 text-xs sm:text-sm focus:ring-2 focus:ring-[#E80000] outline-none">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">추천 이동 동선 및 경로 지침</label>
                            <input type="text" id="input-route" placeholder="예: 중앙 계단 이용 ➡️ 2층 복도 우측 끝" class="w-full border border-gray-300 rounded-xl p-3 text-xs sm:text-sm focus:ring-2 focus:ring-[#E80000] outline-none">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">변경 사유 및 준비물</label>
                            <textarea id="input-reason" rows="2" placeholder="예: 수능형 실기 테스트 진행, 제출용 공책 지참" class="w-full border border-gray-300 rounded-xl p-3 text-xs sm:text-sm focus:ring-2 focus:ring-[#E80000] outline-none"></textarea>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">등록자 작성 정보</label>
                            <input type="text" id="input-by" readonly value="${currentUser.name}" class="w-full border border-gray-200 bg-gray-50 text-gray-500 rounded-xl p-3 text-xs sm:text-sm font-bold outline-none">
                        </div>

                        <button type="submit" class="w-full bg-[#E80000] hover:bg-red-700 text-white font-bold py-3.5 rounded-xl text-xs sm:text-sm shadow-md active:scale-95 transition flex items-center justify-center space-x-1">
                            <span class="material-symbols-outlined text-base">add</span>
                            <span>교실 변경 사항 알림 등록하기</span>
                        </button>
                    </form>
                </div>
            `;
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const newEntry = {
                id: Date.now(),
                subject: document.getElementById('input-subject').value,
                period: document.getElementById('input-period').value,
                floor: document.getElementById('input-floor').value,
                fromRoom: document.getElementById('input-from').value || "1-4 교실 (1층)",
                toRoom: document.getElementById('input-to').value,
                routeInfo: document.getElementById('input-route').value || "계단 이용 교실 입실",
                reason: document.getElementById('input-reason').value || "수업 장소 이동",
                registeredBy: document.getElementById('input-by').value,
                date: "오늘",
                teacherNote: "지각 없이 정시 입실해주시기 바랍니다."
            };

            classroomChanges.unshift(newEntry);
            showToast("새 이동 수업 교실이 정상 등록되었습니다!");
            switchTab('detail', newEntry.id);
        }

        // --- 4. DETAIL VIEW ---
        function renderDetailView(id) {
            const item = classroomChanges.find(c => c.id == id) || classroomChanges[0];
            if (!item) return `<div class="p-6 text-center text-xs">선택된 변경 사항이 없습니다.</div>`;

            return `
                <div class="space-y-4 animate-fadeIn">
                    <!-- Top Bar -->
                    <div class="flex items-center justify-between">
                        <button onclick="switchTab('list')" class="flex items-center space-x-1 text-xs text-gray-600 font-bold">
                            <span class="material-symbols-outlined text-sm">arrow_back</span>
                            <span>목록으로 돌아가기</span>
                        </button>

                        ${currentUser.role === 'leader' ? `
                            <button onclick="deleteItem(${item.id})" class="text-xs text-[#E80000] font-bold flex items-center space-x-0.5 hover:underline">
                                <span class="material-symbols-outlined text-sm">delete</span>
                                <span>삭제</span>
                            </button>
                        ` : ''}
                    </div>

                    <!-- Main Info Box -->
                    <div class="bg-gradient-to-br from-[#FBEAEA] to-white border border-[#E80000]/30 rounded-2xl p-5 shadow-sm space-y-4">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="bg-[#E80000] text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full">
                                    ${item.floor} 이동
                                </span>
                                <h2 class="text-xl font-extrabold text-gray-900 mt-1">${item.subject}</h2>
                                <p class="text-xs text-gray-500 font-medium">${item.period}</p>
                            </div>
                            <span class="material-symbols-outlined text-3xl text-[#E80000]">directions_walk</span>
                        </div>

                        <!-- From To Box -->
                        <div class="bg-white border rounded-xl p-3.5 flex items-center justify-between shadow-xs">
                            <div class="text-center flex-1">
                                <span class="text-[10px] text-gray-400 block font-medium">기존 교실</span>
                                <span class="text-xs font-bold text-gray-700">${item.fromRoom}</span>
                            </div>
                            <span class="material-symbols-outlined text-[#E80000] text-lg">arrow_forward</span>
                            <div class="text-center flex-1">
                                <span class="text-[10px] text-[#E80000] block font-bold">변경 교실 (목적지)</span>
                                <span class="text-sm font-extrabold text-[#E80000]">${item.toRoom}</span>
                            </div>
                        </div>

                        <!-- Details List -->
                        <div class="space-y-2.5 text-xs">
                            <div class="flex items-start space-x-2">
                                <span class="material-symbols-outlined text-gray-400 text-sm mt-0.5">alt_route</span>
                                <div>
                                    <span class="font-bold text-gray-800 block">추천 이동 동선</span>
                                    <span class="text-gray-600">${item.routeInfo}</span>
                                </div>
                            </div>

                            <div class="flex items-start space-x-2">
                                <span class="material-symbols-outlined text-gray-400 text-sm mt-0.5">help_outline</span>
                                <div>
                                    <span class="font-bold text-gray-800 block">변경 사유 및 안내</span>
                                    <span class="text-gray-600">${item.reason}</span>
                                </div>
                            </div>

                            <div class="flex items-start space-x-2">
                                <span class="material-symbols-outlined text-gray-400 text-sm mt-0.5">assignment_turned_in</span>
                                <div>
                                    <span class="font-bold text-gray-800 block">준비물 및 주의사항</span>
                                    <span class="text-gray-600">${item.teacherNote}</span>
                                </div>
                            </div>

                            <div class="flex items-start space-x-2 border-t pt-2 mt-2">
                                <span class="material-symbols-outlined text-gray-400 text-sm">person</span>
                                <span class="text-gray-500">등록한 사용자: <strong class="text-gray-700">${item.registeredBy}</strong></span>
                            </div>
                        </div>
                    </div>

                    <!-- Mini Floor Visual Map Preview -->
                    <div class="bg-slate-900 text-white p-4 rounded-2xl shadow-sm border border-slate-700">
                        <div class="text-xs font-bold text-amber-300 mb-2 flex items-center justify-between">
                            <span>📍 해당 층 건물 지점 (${item.floor})</span>
                            <button onclick="switchTab('list')" class="text-[10px] text-amber-200 underline">큰 지도 전체보기</button>
                        </div>
                        <div class="bg-slate-950 p-2 rounded-xl border border-slate-800">
                            ${renderFloorSketch(item.floor)}
                        </div>
                    </div>
                </div>
            `;
        }

        function deleteItem(id) {
            if (currentUser.role !== 'leader') {
                showToast("선생님 또는 반장만 삭제할 수 있습니다.");
                return;
            }
            classroomChanges = classroomChanges.filter(c => c.id != id);
            showToast("변경 알림이 성공적으로 삭제되었습니다.");
            switchTab('list');
        }

        // --- AUTH & PROFILE MODAL LOGIC ---
        function openProfileModal() {
            document.getElementById('user-info-input').value = currentUser.name;
            document.getElementById('user-role-select').value = currentUser.role;
            document.getElementById('role-auth-container').classList.add('hidden');
            document.getElementById('role-password-input').value = '';
            document.getElementById('profile-modal').classList.remove('hidden');
        }

        function closeProfileModal() {
            document.getElementById('profile-modal').classList.add('hidden');
        }

        function handleRoleSelectChange(selectEl) {
            const authContainer = document.getElementById('role-auth-container');
            if (selectEl.value === 'leader' && currentUser.role !== 'leader') {
                authContainer.classList.remove('hidden');
            } else {
                authContainer.classList.add('hidden');
            }
        }

        function handleInitRoleSelectChange(selectEl) {
            const authContainer = document.getElementById('init-role-auth-container');
            if (selectEl.value === 'leader') {
                authContainer.classList.remove('hidden');
            } else {
                authContainer.classList.add('hidden');
            }
        }

        function saveUserProfile() {
            const newName = document.getElementById('user-info-input').value.trim();
            const selectedRole = document.getElementById('user-role-select').value;
            const passwordInput = document.getElementById('role-password-input').value.trim();

            if (!newName) {
                showToast("학번 및 이름을 입력해주세요.");
                return;
            }

            // Verify password if upgrading to leader
            if (selectedRole === 'leader' && currentUser.role !== 'leader') {
                if (!AUTH_PASSWORDS.includes(passwordInput)) {
                    showToast("❌ 관리자 인증 비밀번호가 올바르지 않습니다!");
                    return;
                }
            }

            currentUser.name = newName;
            currentUser.role = selectedRole;
            updateHeaderUI();
            closeProfileModal();
            showToast("사용자 정보가 변경되었습니다.");
            switchTab(activeTab);
        }

        function submitInitialInfo() {
            const initName = document.getElementById('init-user-name').value.trim();
            const initRole = document.getElementById('init-user-role').value;
            const initPassword = document.getElementById('init-role-password').value.trim();

            if (!initName) {
                showToast("학번과 이름을 꼭 입력해 주세요!");
                return;
            }

            if (initRole === 'leader') {
                if (!AUTH_PASSWORDS.includes(initPassword)) {
                    showToast("❌ 관리자 비밀번호가 틀렸습니다. (예: 10410)");
                    return;
                }
            }

            currentUser.name = initName;
            currentUser.role = initRole;
            updateHeaderUI();

            document.getElementById('welcome-modal').classList.add('hidden');
            showToast(`환영합니다, ${currentUser.name}님!`);
            switchTab('home');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            if (!toast || !msgEl) return;
            msgEl.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // Initialize App View On Window Load
        window.onload = function() {
            updateHeaderUI();
            switchTab('home');
        };
    </script>
</body>
</html>
